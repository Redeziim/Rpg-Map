<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador RPG — Cartógrafo Real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           THEME: Royal Cartographer — Map Tool
           ═══════════════════════════════════════════════ */
        :root {
            --gold: #d4af37;
            --gold-light: #f0d878;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --gold-border: rgba(212, 175, 55, 0.25);
            --parchment: #f4e4bc;
            --ink: #1a1510;
            --ink-light: #2a2018;
            --panel-bg: rgba(20, 16, 12, 0.88);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--ink);
            font-family: 'EB Garamond', 'Cormorant Garamond', serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
            color: var(--parchment);
        }

        /* ─── Viewport & Canvas ─── */
        #viewport {
            width: 100%; height: 100%;
            overflow: scroll;
            cursor: crosshair;
            position: relative;
            background:
                radial-gradient(circle at 50% 50%, #252018 0%, var(--ink) 100%);
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dark) var(--ink);
        }
        #viewport::-webkit-scrollbar { width: 6px; height: 6px; }
        #viewport::-webkit-scrollbar-track { background: var(--ink); }
        #viewport::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

        #canvas-container {
            position: relative;
            transform-origin: 0 0;
            display: inline-block;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
        }

        #map-image {
            display: block;
            border-radius: 2px;
        }

        svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Pontos e linhas do desenho */
        circle {
            fill: var(--gold);
            stroke: var(--ink);
            stroke-width: 1.5px;
            transition: r 0.2s ease;
        }
        circle:last-of-type {
            fill: #fff;
            filter: drop-shadow(0 0 6px var(--gold));
        }
        polygon {
            fill: rgba(212, 175, 55, 0.15);
            stroke: var(--gold);
            stroke-width: 2px;
            stroke-dasharray: 8 4;
            animation: dashMove 2s linear infinite;
        }
        @keyframes dashMove { to { stroke-dashoffset: -24; } }
        line {
            stroke: rgba(212, 175, 55, 0.4);
            stroke-width: 1.5px;
            stroke-dasharray: 4 4;
        }

        /* ─── Floating Panel ─── */
        #overlay-panel {
            position: fixed;
            top: 20px; right: 20px;
            width: 380px;
            min-width: 280px;
            background: var(--panel-bg);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.03);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            resize: both;
            overflow: hidden;
            backdrop-filter: blur(20px) saturate(1.1);
        }

        /* Drag Header */
        #drag-header {
            padding: 14px 18px;
            background: rgba(212, 175, 55, 0.06);
            cursor: move;
            border-bottom: 1px solid var(--gold-border);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #drag-header .drag-dots {
            font-size: 0.6rem;
            color: var(--gold-dark);
            letter-spacing: 2px;
            opacity: 0.5;
        }
        #drag-header:hover .drag-dots { opacity: 0.8; }

        /* Panel Content */
        #panel-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        input, textarea {
            background: rgba(0, 0, 0, 0.4);
            color: var(--parchment);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            border-color: var(--gold-border);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.1);
        }
        input::placeholder { color: rgba(244, 228, 188, 0.25); font-style: italic; }

        textarea {
            height: 100px;
            resize: vertical;
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #a8d5a2;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .btn-undo {
            background: rgba(85, 85, 85, 0.2);
            color: #aaa;
            border-color: rgba(255,255,255,0.1);
        }
        .btn-undo:hover { background: rgba(85, 85, 85, 0.35); color: #ddd; }

        .btn-clear {
            background: rgba(139, 0, 0, 0.2);
            color: #c85a5a;
            border-color: rgba(139, 0, 0, 0.3);
        }
        .btn-clear:hover { background: rgba(139, 0, 0, 0.35); color: #e07070; }

        .btn-copy {
            background: rgba(46, 125, 50, 0.15);
            color: #7bc47e;
            border-color: rgba(46, 125, 50, 0.25);
        }
        .btn-copy:hover {
            background: rgba(46, 125, 50, 0.3);
            color: #a0e0a3;
            box-shadow: 0 0 15px rgba(46, 125, 50, 0.1);
        }

        .info-text {
            font-size: 0.8rem;
            color: rgba(244, 228, 188, 0.35);
            line-height: 1.6;
            text-align: center;
            font-style: italic;
        }
        .info-text b { color: rgba(244, 228, 188, 0.5); font-weight: 600; }

        /* Point counter badge */
        .point-counter {
            position: absolute;
            top: 14px; right: 18px;
            background: var(--gold-dim);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        /* Corner ornaments */
        .corner {
            position: fixed;
            width: 40px; height: 40px;
            pointer-events: none;
            z-index: 900;
            opacity: 0.2;
        }
        .corner-tl { top: 10px; left: 10px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
        .corner-tr { top: 10px; right: 10px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
        .corner-bl { bottom: 10px; left: 10px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
        .corner-br { bottom: 10px; right: 10px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

        /* Zoom indicator */
        #zoom-indicator {
            position: fixed;
            bottom: 20px; left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--gold-border);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            color: var(--gold);
            letter-spacing: 2px;
            z-index: 900;
            backdrop-filter: blur(10px);
        }

        /* Navigation */
        #nav-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 950;
            background: linear-gradient(to bottom, rgba(26,21,16,0.9) 0%, transparent 100%);
            pointer-events: none;
        }
        #nav-header > * { pointer-events: auto; }
        .nav-title {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: rgba(212, 175, 55, 0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .nav-links a {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            color: rgba(212, 175, 55, 0.4);
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 5px 12px;
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .nav-links a:hover {
            color: var(--gold);
            border-color: var(--gold-border);
            background: var(--gold-dim);
        }

    </style>
</head>
<body>

    <!-- Corner Ornaments -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Navigation -->
    <div id="nav-header">
        <div class="nav-title">🜲 Cartógrafo Real</div>
        <div class="nav-links">
            <a href="Leitor.html">Leitor</a>
            <a href="../Mapa/index.html">Mapa V1</a>
        </div>
    </div>

    <!-- Viewport -->
    <div id="viewport">
        <div id="canvas-container">
            <img id="map-image" src="Mapa%20mundo.png" alt="Mapa Base">
            <svg id="drawing-layer"></svg>
        </div>
    </div>

    <!-- Zoom Indicator -->
    <div id="zoom-indicator">ZOOM: 100%</div>

    <!-- Floating Panel -->
    <div id="overlay-panel">
        <div id="drag-header">
            <span>🛠️ Cartógrafo Real</span>
            <span class="drag-dots">● ● ●</span>
            <span class="point-counter" id="point-count">0 pontos</span>
        </div>

        <div id="panel-content">
            <div>
                <label>Nome do Reino ou Local</label>
                <input type="text" id="kingdom-name" placeholder="Ex: Reino de Amurh" autocomplete="off">
            </div>

            <div class="btn-group">
                <button class="btn-undo" onclick="undoLast()">↩ Desfazer</button>
                <button class="btn-clear" onclick="resetPoly()">✕ Limpar</button>
            </div>

            <div>
                <label>Código JSON Gerado</label>
                <textarea id="result-code" placeholder="Clique nos cantos do reino no mapa para gerar o código..." readonly></textarea>
            </div>

            <button class="btn-copy" onclick="copyToClipboard()">📋 Copiar Código</button>

            <div class="info-text">
                <b>Ctrl + Scroll</b> para zoom &nbsp;·&nbsp;
                <b>Clique</b> nos vértices do reino
            </div>
        </div>
    </div>

    <script>
        const svg = document.getElementById('drawing-layer');
        const img = document.getElementById('map-image');
        const container = document.getElementById('canvas-container');
        const output = document.getElementById('result-code');
        const nameInput = document.getElementById('kingdom-name');
        const pointCounter = document.getElementById('point-count');
        const zoomIndicator = document.getElementById('zoom-indicator');

        let points = [];
        let scale = 1;

        // ─── Init ───
        img.onload = function() {
            svg.setAttribute('width', img.naturalWidth);
            svg.setAttribute('height', img.naturalHeight);
            svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
        };

        // ─── Drawing Logic ───
        container.addEventListener('click', (e) => {
            if (e.target.closest('#overlay-panel')) return;
            if (e.target.closest('#nav-header')) return;

            const rect = img.getBoundingClientRect();
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;

            points.push(`${Math.round(x)},${Math.round(y)}`);
            draw();
            generateJSON();
            updateCounter();
        });

        function draw() {
            let html = '';
            if (points.length > 1) {
                // Linhas conectando os pontos
                for (let i = 0; i < points.length - 1; i++) {
                    const [x1, y1] = points[i].split(',');
                    const [x2, y2] = points[i + 1].split(',');
                    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />`;
                }
                // Fecha o polígono se tiver 3+ pontos
                if (points.length >= 3) {
                    const [x1, y1] = points[points.length - 1].split(',');
                    const [x2, y2] = points[0].split(',');
                    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />`;
                }
            }
            if (points.length > 2) {
                html += `<polygon points="${points.join(' ')}" />`;
            }
            points.forEach((p, index) => {
                const [cx, cy] = p.split(',');
                const isLast = index === points.length - 1;
                html += `<circle cx="${cx}" cy="${cy}" r="${isLast ? 5/scale : 4/scale}" style="fill:${isLast ? '#fff' : '#d4af37'}"/>`;
            });
            svg.innerHTML = html;
        }

        function undoLast() {
            points.pop();
            draw();
            generateJSON();
            updateCounter();
        }

        function resetPoly() {
            points = [];
            draw();
            output.value = '';
            nameInput.value = '';
            nameInput.focus();
            updateCounter();
        }

        function generateJSON() {
            const name = nameInput.value.trim() || "NomeDoReino";
            const id = name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
            const json = `    {
        "id": "${id}",
        "name": "${name}",
        "description": "Descrição de ${name}...",
        "image": "https://via.placeholder.com/800x600",
        "points": "${points.join(' ')}"
    },`;
            output.value = json;
        }

        function copyToClipboard() {
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerText;
            btn.innerText = "✓ Copiado!";
            btn.style.background = "rgba(46, 125, 50, 0.4)";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "";
            }, 1500);
        }

        function updateCounter() {
            const count = points.length;
            pointCounter.innerText = count === 1 ? '1 ponto' : `${count} pontos`;
        }

        // ─── Draggable Panel ───
        const panel = document.getElementById("overlay-panel");
        const header = document.getElementById("drag-header");
        let isDragging = false, startX, startY, initialLeft, initialTop;

        header.onmousedown = function(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = panel.offsetLeft;
            initialTop = panel.offsetTop;
            header.style.cursor = 'grabbing';
        };

        document.onmouseup = function() {
            isDragging = false;
            header.style.cursor = 'move';
        };

        document.onmousemove = function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            panel.style.right = 'auto';
            panel.style.left = `${initialLeft + dx}px`;
            panel.style.top = `${initialTop + dy}px`;
        };

        // ─── Zoom Logic ───
        const viewport = document.getElementById('viewport');

        viewport.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale *= delta;
                scale = Math.min(Math.max(0.1, scale), 5);
                container.style.transform = `scale(${scale})`;
                zoomIndicator.innerText = `ZOOM: ${Math.round(scale * 100)}%`;
                draw();
            }
        });
    </script>
</body>
</html>
