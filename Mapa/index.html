<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Interactive Map</title>
    <style>
        /* --- ESTILO GERAL --- */
        body { margin: 0; background: #000; font-family: 'Cinzel', serif; overflow: hidden; }

        /* O CONTAINER DO MUNDO */
        /* Aqui a mágica acontece: Flexbox centraliza tudo */
        #world-container {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* CAMADA DE ZOOM */
        #zoom-layer {
            position: relative;
            transform-origin: center center;
            transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1); /* Efeito 'Ease-Out' suave */
        }

        /* A IMAGEM DO MAPA */
        #map-image {
            display: block;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            /* O tamanho será definido pelo JS para garantir proporção */
        }

        /* O SVG (Áreas de Clique) */
        #map-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        /* ESTILO DOS REINOS */
        polygon {
            fill: transparent; /* Invisível normalmente */
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        polygon:hover {
            fill: rgba(255, 215, 0, 0.15); /* Dourado suave */
            stroke: #ffd700;
            stroke-width: 2px;
            filter: drop-shadow(0 0 10px #ffd700);
        }

        /* PAINEL DE INFORMAÇÕES (MODAL) */
        #info-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%; max-width: 500px;
            background: rgba(10, 10, 12, 0.95);
            border: 1px solid #c9a959;
            color: #e0e0e0;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease 0.5s; /* Delay para esperar o zoom */
            z-index: 100;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        #info-panel.visible {
            opacity: 1; pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        .panel-img {
            width: 100%; height: 200px;
            background-size: cover; background-position: center;
            border-bottom: 2px solid #c9a959;
        }

        .panel-content { padding: 25px; text-align: center; }
        .panel-content h1 { margin: 0 0 10px 0; color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
        
        /* BOTÃO VOLTAR */
        #back-btn {
            position: fixed; bottom: 30px;
            left: 50%; transform: translateX(-50%) translateY(100px);
            background: #c9a959; color: #000;
            border: none; padding: 12px 30px;
            font-weight: bold; cursor: pointer;
            transition: 0.3s;
            z-index: 101; opacity: 0;
        }
        #back-btn.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
        #back-btn:hover { background: #fff; }

    </style>
</head>
<body>

    <div id="world-container">
        <div id="zoom-layer">
            <img id="map-image" src="Mapa Mundo.png" alt="Mapa">
            <svg id="map-svg"></svg>
        </div>
    </div>

    <div id="info-panel">
        <div class="panel-img" id="ui-img"></div>
        <div class="panel-content">
            <h1 id="ui-title">Reino</h1>
            <p id="ui-desc">Descrição...</p>
        </div>
    </div>

    <button id="back-btn" onclick="resetZoom()">VOLTAR PARA O MUNDO</button>

    <script src="rpg_data.js"></script>

    <script>
        // CONFIGURAÇÕES
        const ZOOM_LEVEL = 3.5; // Quanto zoom dá ao clicar (3.5x)

        // ELEMENTOS
        const img = document.getElementById('map-image');
        const svg = document.getElementById('map-svg');
        const zoomLayer = document.getElementById('zoom-layer');
        const panel = document.getElementById('info-panel');
        const btn = document.getElementById('back-btn');

        // 1. INICIALIZAÇÃO SEGURA
        // Garante que o código só rode quando a imagem existir e tiver tamanho
        img.onload = () => {
            setupMap();
        };
        // Fallback caso a imagem já esteja em cache
        if (img.complete) setupMap();

        function setupMap() {
            const w = img.naturalWidth;
            const h = img.naturalHeight;

            console.log(`Mapa carregado: ${w}x${h}`);

            // Força o SVG a ter o tamanho exato da imagem original
            // Isso corrige 100% dos problemas de alinhamento
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            
            // Ajusta o tamanho inicial na tela
            fitToScreen();

            // Desenha os polígonos
            drawKingdoms();
        }

        // 2. DESENHAR OS REINOS (Lê do arquivo rpg_data.js)
        function drawKingdoms() {
            if (typeof reinos === 'undefined') return alert("Erro: rpg_data.js não carregado!");

            reinos.forEach(reino => {
                const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");

                // Aceita tanto string quanto array de pares [x, y]
                const pointsString = Array.isArray(reino.points)
                    ? reino.points.map(([x, y]) => `${x},${y}`).join(' ')
                    : reino.points;

                poly.setAttribute("points", pointsString);
                
                // Clique no Reino
                poly.onclick = (e) => {
                    e.stopPropagation(); // Não clica no fundo
                    zoomIn(reino, poly);
                };

                svg.appendChild(poly);
            });
        }

        // 3. ZOOM NO REINO
        function zoomIn(data, element) {
            // Matemática para achar o centro do polígono
            const bbox = element.getBBox();
            const cx = bbox.x + (bbox.width / 2);
            const cy = bbox.y + (bbox.height / 2);
            
            const mapW = img.naturalWidth;
            const mapH = img.naturalHeight;

            // Converte pixel para porcentagem (necessário para CSS transform-origin)
            const originX = (cx / mapW) * 100;
            const originY = (cy / mapH) * 100;

            // Aplica animação
            zoomLayer.style.transformOrigin = `${originX}% ${originY}%`;
            zoomLayer.style.transform = `scale(${ZOOM_LEVEL})`;

            // Atualiza UI
            document.getElementById('ui-title').innerText = data.name;
            document.getElementById('ui-desc').innerText = data.description;
            document.getElementById('ui-img').style.backgroundImage = `url('${data.image}')`;

            // Mostra UI
            panel.classList.add('visible');
            btn.classList.add('visible');
        }

        // 4. RESETAR
        function resetZoom() {
            fitToScreen(); // Volta ao tamanho ideal
            panel.classList.remove('visible');
            btn.classList.remove('visible');
        }

        // Auxiliar: Faz o mapa caber na tela sem cortes
        function fitToScreen() {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            // Calcula qual escala faz a imagem caber inteira
            const scale = Math.min(screenW / w, screenH / h) * 0.95; // 95% para margem
            
            // Define tamanho base
            zoomLayer.style.width = w + "px";
            zoomLayer.style.height = h + "px";
            zoomLayer.style.transform = `scale(${scale})`;
        }

        // Recalcula se redimensionar a janela
        window.addEventListener('resize', () => {
            if(!panel.classList.contains('visible')) fitToScreen();
        });

    </script>
</body>
</html>
