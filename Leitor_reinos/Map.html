<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapeador RPG V2 - Overlay</title>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            font-family: 'Consolas', monospace; 
            overflow: hidden; /* O scroll é interno no mapa */
            width: 100vw; height: 100vh;
        }

        /* Área do Mapa (Zoom e Pan) */
        #viewport {
            width: 100%; height: 100%;
            overflow: scroll;
            cursor: crosshair;
            position: relative;
            background: #333;
        }

        #canvas-container {
            position: relative;
            transform-origin: 0 0;
            display: inline-block;
        }

        #map-image {
            display: block;
            /* A imagem define o tamanho do canvas */
        }

        svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* Deixa o clique passar para o container */
        }

        /* Estilo dos Pontos e Linhas */
        circle { fill: #ff0055; stroke: white; stroke-width: 1px; r: 3px; }
        polygon { fill: rgba(0, 255, 100, 0.4); stroke: #00ff66; stroke-width: 3px; }
        line { stroke: #ff0055; stroke-width: 2px; stroke-dasharray: 5; }

        /* O OVERLAY (Janela Flutuante) */
        #overlay-panel {
            position: fixed;
            top: 20px; right: 20px;
            width: 350px;
            min-width: 250px;
            height: auto;
            background: rgba(0, 0, 0, 0.85); /* Fundo escuro transparente */
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            resize: both; /* Permite redimensionar */
            overflow: auto;
            backdrop-filter: blur(5px);
        }

        /* Cabeçalho para arrastar */
        #drag-header {
            padding: 10px;
            background: #2a2a2a;
            cursor: move;
            border-bottom: 1px solid #444;
            font-weight: bold;
            color: #ffd700;
            user-select: none;
            display: flex; justify-content: space-between;
        }

        #panel-content {
            padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }

        label { font-size: 0.8em; color: #ccc; }
        input, textarea {
            background: #111; color: #0f0;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            width: 100%; box-sizing: border-box;
        }
        
        textarea { height: 100px; resize: vertical; }

        .btn-group { display: flex; gap: 5px; }
        button {
            flex: 1;
            padding: 10px;
            border: none; border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-undo { background: #555; color: white; }
        .btn-clear { background: #d32f2f; color: white; }
        .btn-copy { background: #2e7d32; color: white; }
        
        button:hover { opacity: 0.8; }

        .info-text { font-size: 0.75rem; color: #888; margin-top: 5px; }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas-container">
            <img id="map-image" src="Mapa Mundo.png" alt="Mapa Base">
            <svg id="drawing-layer"></svg>
        </div>
    </div>

    <div id="overlay-panel">
        <div id="drag-header">
            <span>🛠️ Mapeador RPG</span>
            <span style="font-size: 0.8em">:::</span>
        </div>
        
        <div id="panel-content">
            <div>
                <label>Nome do Reino/Local:</label>
                <input type="text" id="kingdom-name" placeholder="Ex: Amurh" autocomplete="off">
            </div>

            <div class="btn-group">
                <button class="btn-undo" onclick="undoLast()">↩ Desfazer</button>
                <button class="btn-clear" onclick="resetPoly()">🗑️ Limpar</button>
            </div>

            <textarea id="result-code" placeholder="O código JSON aparecerá aqui..." readonly></textarea>
            
            <button class="btn-copy" onclick="copyToClipboard()">📋 Copiar Código</button>

            <div class="info-text">
                Dica: Use <b>Ctrl + Scroll</b> para zoom.<br>
                Clique nos cantos do reino para desenhar.
            </div>
        </div>
    </div>

    <script>
        const svg = document.getElementById('drawing-layer');
        const img = document.getElementById('map-image');
        const container = document.getElementById('canvas-container');
        const output = document.getElementById('result-code');
        const nameInput = document.getElementById('kingdom-name');
        
        let points = []; 
        let scale = 1;

        // --- LÓGICA DE DESENHO ---

        img.onload = function() {
            // Sincroniza o tamanho do SVG com a imagem real
            svg.setAttribute('width', img.naturalWidth);
            svg.setAttribute('height', img.naturalHeight);
            svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
        }

        // Clique no container (para pegar coordenadas relativas à imagem)
        container.addEventListener('click', (e) => {
            // Se clicou no painel, ignora
            if(e.target.closest('#overlay-panel')) return;

            // Pega o bounding box da IMAGEM, não da tela
            const rect = img.getBoundingClientRect();
            
            // Calcula a posição relativa dentro da imagem (considerando zoom/scroll)
            const x = (e.clientX - rect.left) / scale; // Remove o efeito do zoom CSS
            const y = (e.clientY - rect.top) / scale;

            // Arredonda
            points.push(`${Math.round(x)},${Math.round(y)}`);
            
            draw();
            generateJSON();
        });

        function draw() {
            let html = '';
            // Polígono fechado
            if (points.length > 0) {
                html += `<polygon points="${points.join(' ')}" />`;
            }
            // Pontos de clique
            points.forEach((p, index) => {
                const [cx, cy] = p.split(',');
                // O último ponto é destacado
                const color = index === points.length - 1 ? 'white' : '#ff0055';
                
                // AQUI ESTÁ A MUDANÇA: Mudei de 6/scale para 3/scale
                // Isso faz o ponto ficar com metade do tamanho
                html += `<circle cx="${cx}" cy="${cy}" r="${3/scale}" style="fill:${color}"/>`; 
            });
            svg.innerHTML = html;
        }
        

        function undoLast() {
            points.pop();
            draw();
            generateJSON();
        }

        function resetPoly() {
            points = [];
            draw();
            output.value = '';
            nameInput.value = '';
            nameInput.focus();
        }

        function generateJSON() {
            const name = nameInput.value.trim() || "NomeDoReino";
            const id = name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
            
            // Formato JSON limpo para o database.js
            const json = `
    {
        "id": "${id}",
        "name": "${name}",
        "description": "Descrição de ${name}...",
        "image": "https://via.placeholder.com/800x600",
        "points": "${points.join(' ')}"
    },`;
            output.value = json;
        }

        function copyToClipboard() {
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerText;
            btn.innerText = "Copiado! ✅";
            setTimeout(() => btn.innerText = originalText, 1500);
        }

        // --- LÓGICA DA JANELA FLUTUANTE (DRAG & DROP) ---
        
        const panel = document.getElementById("overlay-panel");
        const header = document.getElementById("drag-header");
        let isDragging = false, startX, startY, initialLeft, initialTop;

        header.onmousedown = function(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = panel.offsetLeft;
            initialTop = panel.offsetTop;
            header.style.cursor = 'grabbing';
        };

        document.onmouseup = function() {
            isDragging = false;
            header.style.cursor = 'move';
        };

        document.onmousemove = function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            // Remove 'right' e usa 'left' para permitir movimento livre
            panel.style.right = 'auto'; 
            panel.style.left = `${initialLeft + dx}px`;
            panel.style.top = `${initialTop + dy}px`;
        };

        // --- LÓGICA DE ZOOM (Simples via CSS Scale) ---
        const viewport = document.getElementById('viewport');
        
        viewport.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale *= delta;
                scale = Math.min(Math.max(0.1, scale), 5); // Limites de zoom
                container.style.transform = `scale(${scale})`;
                
                // Redesenha os pontos para manter o tamanho visual dos círculos constante
                draw();
            }
        });

    </script>
</body>
</html>
